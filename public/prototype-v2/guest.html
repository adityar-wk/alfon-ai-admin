<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Emma Davis · Guest Chat</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: "Inter", sans-serif;
      background: #ECE5DD;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }
    #app {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: #ECE5DD;
    }
    @media (min-width: 500px) {
      body { padding: 40px 0; align-items: center; }
      #app {
        height: 860px;
        border-radius: 44px;
        overflow: hidden;
        box-shadow: 0 40px 80px rgba(0,0,0,0.28), 0 0 0 1px rgba(0,0,0,0.08);
      }
    }

    /* ── Header ── */
    .wa-header {
      background: #1F2C34;
      padding: 48px 16px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .wa-avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: #E8623A;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; color: #fff;
      flex-shrink: 0;
    }
    .wa-header-info { flex: 1; }
    .wa-header-name { font-size: 15px; font-weight: 600; color: #fff; }
    .wa-header-sub  { font-size: 12px; color: rgba(255,255,255,0.55); margin-top: 1px; }
    .wa-header-dot  { width: 8px; height: 8px; border-radius: 50%; background: #25D366; display: inline-block; margin-right: 4px; }

    /* ── Messages ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      -webkit-overflow-scrolling: touch;
    }
    #messages::-webkit-scrollbar { display: none; }

    .msg-wrap { display: flex; }
    .msg-wrap.guest  { justify-content: flex-end; }
    .msg-wrap.hotel  { justify-content: flex-start; }

    .msg-bubble {
      max-width: 78%;
      padding: 8px 10px 6px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-line;
      position: relative;
    }
    .msg-bubble.guest {
      background: #DCF8C6;
      border-radius: 8px 0px 8px 8px;
      color: #111;
    }
    .msg-bubble.hotel {
      background: #fff;
      border-radius: 0px 8px 8px 8px;
      color: #111;
    }
    .msg-bubble.ai-label {
      background: #fff;
    }
    .msg-time {
      font-size: 10px;
      color: rgba(0,0,0,0.4);
      text-align: right;
      margin-top: 3px;
    }
    .msg-ai-tag {
      font-size: 10px;
      font-weight: 700;
      color: #E8623A;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .divider {
      text-align: center;
      font-size: 11px;
      color: rgba(0,0,0,0.4);
      background: rgba(0,0,0,0.06);
      border-radius: 99px;
      padding: 3px 10px;
      align-self: center;
      margin: 6px 0;
    }

    /* ── Quick replies ── */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 12px 4px;
      flex-shrink: 0;
    }
    .quick-btn {
      padding: 7px 14px;
      border-radius: 99px;
      border: 1.5px solid #25D366;
      background: #fff;
      color: #111;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: "Inter", sans-serif;
      transition: background 0.15s;
    }
    .quick-btn:active { background: #f0fff4; }

    /* ── Input bar ── */
    .input-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px 24px;
      background: #F0F2F5;
      flex-shrink: 0;
    }
    #msg-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 24px;
      border: none;
      outline: none;
      font-size: 14px;
      font-family: "Inter", sans-serif;
      background: #fff;
      color: #111;
      resize: none;
      max-height: 100px;
      overflow-y: auto;
    }
    #send-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: #25D366;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    #send-btn:active { background: #1da851; }
    #send-btn svg { width: 20px; height: 20px; fill: #fff; }

    /* ── Typing indicator ── */
    .typing {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 10px 12px;
      background: #fff;
      border-radius: 0 8px 8px 8px;
      width: fit-content;
    }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%; background: #999;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    /* ── Sent tick ── */
    .tick { font-size: 10px; color: #53bdeb; margin-left: 3px; }
  </style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <div class="wa-header">
    <div class="wa-avatar">H</div>
    <div class="wa-header-info">
      <div class="wa-header-name">Hotel Concierge</div>
      <div class="wa-header-sub"><span class="wa-dot"></span>online</div>
    </div>
    <div style="display:flex;gap:16px;color:rgba(255,255,255,0.6);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </div>
  </div>

  <!-- Messages -->
  <div id="messages"></div>

  <!-- Quick replies -->
  <div class="quick-replies" id="quick-replies">
    <button class="quick-btn" onclick="quickSend('I need a late checkout tomorrow please.')">Late checkout</button>
    <button class="quick-btn" onclick="quickSend('Can you book a table for dinner tonight?')">Dinner reservation</button>
    <button class="quick-btn" onclick="quickSend('I would like to book a spa treatment for tomorrow morning.')">Spa booking</button>
    <button class="quick-btn" onclick="quickSend('Can you arrange a taxi to JFK airport at 10 AM?')">Taxi to airport</button>
    <button class="quick-btn" onclick="quickSend('Could I have extra pillows and towels please?')">Extra pillows</button>
  </div>

  <!-- Input -->
  <div class="input-bar">
    <textarea id="msg-input" placeholder="Message" rows="1"></textarea>
    <button id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
  // ── Seed messages ──
  const SEED = [
    { sender: "divider", text: "Yesterday" },
    { sender: "guest", text: "Hi, I'd like to arrange a private transfer to the airport tomorrow morning at 7:00 AM.", time: "9:12 PM" },
    { sender: "hotel", text: "Good evening, Ms. Davis. We would be delighted to arrange that for you. Could you let us know how many guests will be travelling and how many pieces of luggage you will have?", time: "9:13 PM", ai: true },
    { sender: "guest", text: "There will be 3 of us with 4 suitcases.", time: "9:14 PM" },
    { sender: "hotel", text: "For 3 passengers and 4 suitcases, we recommend our Business Class SUV. A task has been created for our Concierge team to confirm the details with you shortly.", time: "9:15 PM", ai: true },
    { sender: "guest", text: "Perfect, thank you!", time: "9:16 PM" },
    { sender: "divider", text: "Today" },
  ];

  const messagesEl = document.getElementById("messages");
  let msgCounter = 100;

  function timeNow() {
    return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function renderBubble({ sender, text, time, ai }) {
    if (sender === "divider") {
      const d = document.createElement("div");
      d.className = "divider";
      d.textContent = text;
      messagesEl.appendChild(d);
      return;
    }
    const wrap = document.createElement("div");
    wrap.className = `msg-wrap ${sender}`;

    const bubble = document.createElement("div");
    bubble.className = `msg-bubble ${sender}`;

    if (sender === "hotel" && ai) {
      const tag = document.createElement("div");
      tag.className = "msg-ai-tag";
      tag.innerHTML = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#E8623A" stroke-width="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> Alfon AI`;
      bubble.appendChild(tag);
    }

    const p = document.createElement("p");
    p.style.margin = "0";
    p.style.whiteSpace = "pre-line";
    p.textContent = text;
    bubble.appendChild(p);

    const t = document.createElement("div");
    t.className = "msg-time";
    t.innerHTML = (time || timeNow()) + (sender === "guest" ? ' <span class="tick">✓✓</span>' : '');
    bubble.appendChild(t);

    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // Render seed
  SEED.forEach(renderBubble);

  // ── Typing indicator ──
  let typingEl = null;
  function showTyping() {
    typingEl = document.createElement("div");
    typingEl.className = "msg-wrap hotel";
    typingEl.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    messagesEl.appendChild(typingEl);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
  function hideTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  // ── Send ──
  function sendMessage() {
    const input = document.getElementById("msg-input");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    input.style.height = "auto";

    const t = timeNow();
    renderBubble({ sender: "guest", text, time: t });

    // Write to localStorage for mobile-app.js to pick up
    const payload = { id: ++msgCounter, content: text, timestamp: t, from: "emma", ts: Date.now() };
    localStorage.setItem("alfon_guest_msg", JSON.stringify(payload));

    // Show typing then auto-reply
    setTimeout(() => {
      showTyping();
      setTimeout(() => {
        hideTyping();
        const reply = autoReply(text);
        renderBubble({ sender: "hotel", text: reply, time: timeNow(), ai: true });
      }, 1800);
    }, 600);
  }

  function quickSend(text) {
    document.getElementById("msg-input").value = text;
    sendMessage();
  }

  // ── Auto-reply logic ──
  function autoReply(text) {
    const t = text.toLowerCase();
    if (t.includes("checkout") || t.includes("late check"))
      return "Of course, Ms. Davis. I have flagged a late checkout request for our Front Desk team. They will confirm the available time shortly. Is there anything else we can arrange for you?";
    if (t.includes("dinner") || t.includes("table") || t.includes("restaurant") || t.includes("reservation"))
      return "Wonderful, Ms. Davis. I have passed your dinner reservation request to our Concierge team. They will confirm your table time and any seating preferences shortly. May I ask how many guests will be dining?";
    if (t.includes("spa") || t.includes("massage") || t.includes("treatment"))
      return "Lovely choice, Ms. Davis. I have created a spa booking request for our Wellness team. They will reach out to confirm your preferred treatment and time. Is there anything specific you would like from the spa menu?";
    if (t.includes("taxi") || t.includes("transfer") || t.includes("airport") || t.includes("car"))
      return "Certainly, Ms. Davis. I have raised a transport request for our Concierge team. They will confirm your pickup details and vehicle shortly. Could you confirm the exact pickup time?";
    if (t.includes("pillow") || t.includes("towel") || t.includes("extra") || t.includes("blanket"))
      return "Of course, Ms. Davis. I have notified our Housekeeping team right away. Your items will be with you within the next 10 minutes. Is there anything else we can bring up for you?";
    return "Thank you, Ms. Davis. I have passed your request to the relevant team and they will be in touch shortly. Is there anything else I can assist you with?";
  }

  // ── Auto-resize textarea ──
  document.getElementById("msg-input").addEventListener("input", function() {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 100) + "px";
  });

  document.getElementById("msg-input").addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>
</body>
</html>
